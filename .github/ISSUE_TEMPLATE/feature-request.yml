name: Feature request
description: Suggest an improvement for FrameDeck Studio.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing request describing the same idea.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Explain the user problem before proposing a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Describe how the feature should behave.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - All platforms
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention current workarounds or similar behavior in other tools.